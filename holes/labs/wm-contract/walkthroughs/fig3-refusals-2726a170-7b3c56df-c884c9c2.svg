<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="920" height="380" fill="white"/><text x="20" y="26" font-size="14" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">Two refusal ladders: the discharge binder at close, and publication at tick start</text><text x="20" y="44" font-size="10" text-anchor="start" font-family="monospace">tick 09-24 2726a170 · tick 09-23 7b3c56df · discharge-operation c884c9c2 c884c9c2 · 9 operations read</text><text x="20" y="74" font-size="10.5" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">finalize! (repair_discharge.clj:107-184) — stages in order; the first refusal is the recorded one</text><rect x="20" y="84" width="205" height="70" rx="5" fill="#fbeeee" stroke="#b23a48"/><text x="28" y="100" font-size="10" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:binding  safe-id! (evidence:50-53)</text><text x="28" y="116" font-size="8.6" text-anchor="start" font-family="monospace">9 operations, all</text><text x="28" y="131" font-size="8.6" text-anchor="start" font-family="monospace">  [:binding :unsafe-repair-id]</text><text x="28" y="146" font-size="8.6" text-anchor="start" font-family="monospace">:repair/id nil on a T- target</text><path d="M225,115 L240,115" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="242" y="84" width="205" height="70" rx="5" fill="#fbeeee" stroke="#b23a48"/><text x="250" y="100" font-size="10" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:eligibility  class in</text><text x="250" y="116" font-size="8.6" text-anchor="start" font-family="monospace">  #{:independent-review-failure :machine-failure}</text><text x="250" y="131" font-size="8.6" text-anchor="start" font-family="monospace">ad16e2c2 and 444fb018 are</text><text x="250" y="146" font-size="8.6" text-anchor="start" font-family="monospace">:environmental-hold -&gt; refused</text><path d="M447,115 L462,115" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="464" y="84" width="205" height="70" rx="5" fill="#fbeeee" stroke="#b23a48"/><text x="472" y="100" font-size="10" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:durable-close  (true? :grounded?)</text><text x="472" y="116" font-size="8.6" text-anchor="start" font-family="monospace">14 closes :grounded? {false 9, true 5}</text><text x="472" y="131" font-size="8.6" text-anchor="start" font-family="monospace">76/002 (the selected-ticket close)</text><text x="472" y="146" font-size="8.6" text-anchor="start" font-family="monospace">is :grounded? false</text><path d="M669,115 L684,115" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="686" y="84" width="205" height="70" rx="5" fill="#fbeeee" stroke="#b23a48"/><text x="694" y="100" font-size="10" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:implementation / :successor</text><text x="694" y="116" font-size="8.6" text-anchor="start" font-family="monospace">never reached on any recorded</text><text x="694" y="131" font-size="8.6" text-anchor="start" font-family="monospace">operation; resolutions/ gained</text><text x="694" y="146" font-size="8.6" text-anchor="start" font-family="monospace">no row from a click</text><text x="20" y="184" font-size="10.5" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">derive (repair_discharge_receipt.clj:15-56) — run by catch-up! over every resolutions/ file at tick start</text><rect x="20" y="194" width="205" height="70" rx="5" fill="#eef7ee" stroke="#3a7d44"/><text x="28" y="210" font-size="10" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:resolution-not-successful</text><text x="28" y="226" font-size="8.6" text-anchor="start" font-family="monospace">68 resolutions, statuses</text><text x="28" y="241" font-size="8.6" text-anchor="start" font-family="monospace">  {:resolved 68}</text><text x="28" y="256" font-size="8.6" text-anchor="start" font-family="monospace">passes</text><path d="M225,225 L240,225" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="242" y="194" width="205" height="70" rx="5" fill="#fbeeee" stroke="#b23a48"/><text x="250" y="210" font-size="10" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:resolution-context-unavailable</text><text x="250" y="226" font-size="8.6" text-anchor="start" font-family="monospace">context on resolutions   0/68</text><text x="250" y="241" font-size="8.6" text-anchor="start" font-family="monospace">context on implementations 0/59</text><text x="250" y="256" font-size="8.6" text-anchor="start" font-family="monospace">refused for every id</text><path d="M447,225 L462,225" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="464" y="194" width="205" height="70" rx="5" fill="#fbeeee" stroke="#b23a48"/><text x="472" y="210" font-size="10" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">on the tick records</text><text x="472" y="226" font-size="8.6" text-anchor="start" font-family="monospace">09-24 {:resolution-context-unavailable 68}</text><text x="472" y="241" font-size="8.6" text-anchor="start" font-family="monospace">09-23 {:resolution-context-unavailable 59}</text><text x="472" y="256" font-size="8.6" text-anchor="start" font-family="monospace">the receipt directory does not exist</text><text x="20" y="290" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">Reading: the only writer of :repair/discharge-context is finalize! itself (:141-178), which has never passed :binding on a</text><text x="20" y="306" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">recorded operation. So publication cannot succeed until a discharge does, and a discharge cannot bind a ticket-queue action</text><text x="20" y="322" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">that carries no :repair/id (e61a10cb adds the ticket-links lookup; it is later than every recorded operation). No Holes row</text><text x="20" y="338" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">names this ladder; §2 of the walkthrough says so rather than assign one.</text></svg>