t join resolution</text><text x="26" y="243" font-size="8" text-anchor="start" font-family="monospace">  to implementation</text><text x="26" y="258" font-size="8" text-anchor="start" font-family="monospace">hole: none named (§2)</text><text x="194" y="168" font-size="8" text-anchor="start" font-family="monospace">:open-stop-lines {:count 34}</text><text x="194" y="183" font-size="8" text-anchor="start" font-family="monospace">read as evidence; selection</text><text x="194" y="198" font-size="8" text-anchor="start" font-family="monospace">  proceeds (:4520-4521)</text><text x="194" y="213" font-size="8" text-anchor="start" font-family="monospace">09-23 record: count 51</text><text x="194" y="228" font-size="8" text-anchor="start" font-family="monospace"></text><text x="194" y="243" font-size="8" text-anchor="start" font-family="monospace">hole: none named per id;</text><text x="194" y="258" font-size="8" text-anchor="start" font-family="monospace">  standing state (fig 2)</text><text x="362" y="168" font-size="8" text-anchor="start" font-family="monospace">77/001 refusals 280:</text><text x="362" y="183" font-size="8" text-anchor="start" font-family="monospace">  :universe-not-admitted 276</text><text x="362" y="198" font-size="8" text-anchor="start" font-family="monospace">  :no-constructed-candidate 4</text><text x="362" y="213" font-size="8" text-anchor="start" font-family="monospace">  each [:new-wanted-token-</text><text x="362" y="228" font-size="8" text-anchor="start" font-family="monospace">   within-horizon]</text><text x="362" y="243" font-size="8" text-anchor="start" font-family="monospace">throw :4647 -&gt; :abstained</text><text x="362" y="258" font-size="8" text-anchor="start" font-family="monospace">hole: H-interp, H-exits</text><text x="530" y="168" font-size="8" text-anchor="start" font-family="monospace">09-23 :cascade-selected</text><text x="530" y="183" font-size="8" text-anchor="start" font-family="monospace">  T-repair-occ-444fb018c…</text><text x="530" y="198" font-size="8" text-anchor="start" font-family="monospace">  wants = the ticket's tokens</text><text x="530" y="213" font-size="8" text-anchor="start" font-family="monospace">  missions deferred-to-declaration 2</text><text x="530" y="228" font-size="8" text-anchor="start" font-family="monospace">  holes not projected 469/585</text><text x="530" y="243" font-size="8" text-anchor="start" font-family="monospace"></text><text x="530" y="258" font-size="8" text-anchor="start" font-family="monospace">hole: H-exits, H-grain</text><text x="698" y="168" font-size="8" text-anchor="start" font-family="monospace">76/002 :outcome :grounded-no-change</text><text x="698" y="183" font-size="8" text-anchor="start" font-family="monospace">  :grounded? false</text><text x="698" y="198" font-size="8" text-anchor="start" font-family="monospace">  :accepted? true</text><text x="698" y="213" font-size="8" text-anchor="start" font-family="monospace">  witness :resolved? false</text><text x="698" y="228" font-size="8" text-anchor="start" font-family="monospace">  run-ending class :unknown</text><text x="698" y="243" font-size="8" text-anchor="start" font-family="monospace"></text><text x="698" y="258" font-size="8" text-anchor="start" font-family="monospace">hole: theorem statement</text><text x="866" y="168" font-size="8" text-anchor="start" font-family="monospace">09-23 :evidence-unavailable</text><text x="866" y="183" font-size="8" text-anchor="start" font-family="monospace">  :reason :unsafe-repair-id</text><text x="866" y="198" font-size="8" text-anchor="start" font-family="monospace">  :repair/id nil, op c884c9c2</text><text x="866" y="213" font-size="8" text-anchor="start" font-family="monospace">09-24 :not-applicable</text><text x="866" y="228" font-size="8" text-anchor="start" font-family="monospace">  (no selected action)</text><text x="866" y="243" font-size="8" text-anchor="start" font-family="monospace"></text><text x="866" y="258" font-size="8" text-anchor="start" font-family="monospace">hole: none named (§2)</text><text x="1034" y="168" font-size="8" text-anchor="start" font-family="monospace">finding repair-o… opened</text><text x="1034" y="183" font-size="8" text-anchor="start" font-family="monospace">  :environmental-hold</text><text x="1034" y="198" font-size="8" text-anchor="start" font-family="monospace">  :failure-kind :abstained</text><text x="1034" y="213" font-size="8" text-anchor="start" font-family="monospace">  contract requires 2</text><text x="1034" y="228" font-size="8" text-anchor="start" font-family="monospace">   (:3532-3533)</text><text x="1034" y="243" font-size="8" text-anchor="start" font-family="monospace">no typed decline on tick (AR-16)</text><text x="1034" y="258" font-size="8" text-anchor="start" font-family="monospace">hole: H-interp, H-exits; carrier</text><text x="20" y="306" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">Reading: the numbered circles are the six stop sites of the table in 06-where-flights-end.md §2, placed at the phase</text><text x="20" y="322" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">where the record shows the flight ending. Site 5 appears twice: publication runs at tick start over every resolution;</text><text x="20" y="338" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">the discharge binder runs at finalize-run! on the selected action. Line numbers are full_loop_runner.clj at the HEAD in §Verification.</text><text x="20" y="368" font-size="10" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">What continuing would have looked like, per site (the hole's 'what the machine must do', PROOF-2a Holes table):</text><text x="20" y="386" font-size="9.5" text-anchor="start" font-family="monospace">1  an interpreted pattern producing the target's false want, and the wants read from the mission's criteria</text><text x="20" y="401" font-size="9.5" text-anchor="start" font-family="monospace">2  the flight's target is the mission; its wants are the mission's exits; a grain check before enactment</text><text x="20" y="416" font-size="9.5" text-anchor="start" font-family="monospace">3  a close that reads the mission's criteria met, with a grounding witness that resolved</text><text x="20" y="431" font-size="9.5" text-anchor="start" font-family="monospace">4  the decline carried on the tick record, so the hole is visible from the record it opened</text><text x="20" y="446" font-size="9.5" text-anchor="start" font-family="monospace">5  a selected action that names its finding, and a resolution the store can join to its implementation</text><text x="20" y="461" font-size="9.5" text-anchor="start" font-family="monospace">6  the 34 obligations discharged or dismissed by a path the store records</text></svg>