<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="1080" height="380" fill="white"/><text x="40" y="36" font-size="15" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">The action marginal — one policy per action, so the sum is a lookup</text><text x="40" y="58" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">bayes-choice (cascade_selection.clj:147-152) sums posterior mass per action key; the key is each cascade's chain head (policy.clj:147, :403-404).</text><rect x="40" y="100" width="260" height="56" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="50" y="122" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">candidate :C1</text><text x="50" y="140" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">posterior mass 0.7652123434763317</text><path d="M300,128 L430,128" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="365" y="124" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">chain head</text><rect x="430" y="100" width="330" height="56" rx="5" fill="#dceee3" stroke="#287447"/><text x="440" y="122" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">action :apparatus/done-is-observed-running</text><text x="440" y="140" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">marginal mass 0.7652123434763317</text><text x="780" y="132" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">&lt;- bayes-choice</text><rect x="40" y="190" width="260" height="56" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="50" y="212" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">candidate :C2</text><text x="50" y="230" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">posterior mass 0.23478765652366848</text><path d="M300,218 L430,218" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="365" y="214" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">chain head</text><rect x="430" y="190" width="330" height="56" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="440" y="212" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">action :aif/declare-the-conditioning</text><text x="440" y="230" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">marginal mass 0.23478765652366848</text><text x="40" y="300" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">Each candidate's head is a distinct key, so every action's marginal is exactly one policy's mass; the argmax is a lookup, not a sum. (Several policies sharing one head would add — not on this record.)</text><text x="40" y="320" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">per-policy argmax (policy.clj:437-440): :C1 at 0.7652123434763317 — agrees with the marginal's winner :apparatus/done-is-observed-running at 0.7652123434763317.</text><text x="40" y="340" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">ticket-queue receipt: :decided-by :ticket-queue, :status :front-stratum, one eligible target, stratum posterior = full posterior: true.</text></svg>