<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="1240" height="760" fill="white"/><text x="40" y="36" font-size="15" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">The comparison record of 76/002 — predicted vs observed, the verdict, and no truth leg</text><text x="40" y="58" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">007-closed.edn [:payload :judgment :token-outcome-comparison]: :schema :wm/token-outcome-comparison-v1, :status :compared, :artifact-sha 97e17e10, 6 measurement rows, 1 wanted row.</text><rect x="40" y="80" width="1160" height="60" rx="5" fill="#dceee3" stroke="#287447"/><text x="50" y="100" font-size="13" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:restoration-accepted   :predicted 175/256   :observed true   :verdict :predicted-and-observed</text><text x="50" y="122" font-size="10" text-anchor="start" font-family="monospace">:measurement :result {:observed true :check :C4 :evidence {:resolved-sha 97e17e10 :decl "**Status:** DONE" :file-present true}}   resolved-sha = :artifact-sha: true</text><text x="40" y="170" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">compare-outcomes (token_outcome.clj:48-82) — the verdict is a comparison of the frozen prediction with the locator's report, never with a truth:</text><text x="50" y="190" font-size="11" text-anchor="start" font-family="monospace">   :observation-missing   any missing kind (:66-72)</text><text x="50" y="210" font-size="11" text-anchor="start" font-weight="bold" font-family="monospace">-&gt; :predicted-and-observed   (pos? predicted) and observed   &lt;- this row</text><text x="50" y="230" font-size="11" text-anchor="start" font-family="monospace">   :predicted-not-observed   (pos? predicted) and not observed</text><text x="50" y="250" font-size="11" text-anchor="start" font-family="monospace">   :not-predicted-observed   predicted 0 and observed</text><text x="50" y="270" font-size="11" text-anchor="start" font-family="monospace">   :neither   predicted 0 and not observed</text><text x="40" y="306" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">Where the measurement came from:</text><text x="50" y="324" font-size="10" text-anchor="start" font-family="monospace">:measurement-source /home/joe/code/futon3c/data/wm-d-task-enactment/action-5c1163d2-3e45-4fea-8919-6e2b41c6acfe.edn</text><text x="50" y="342" font-size="10" text-anchor="start" font-family="monospace">  recorded :sha256 161d0c1c9afa30e927d4d08a110256820ee3563d227aac7b7c38dc1f921cdc66</text><text x="50" y="360" font-size="10" text-anchor="start" font-family="monospace">  raw-byte sha256 of that file now: 161d0c1c9afa30e927d4d08a110256820ee3563d227aac7b7c38dc1f921cdc66   equal: true;  the file's :after-token-evidence equals the comparison's :measurements: true</text><text x="50" y="378" font-size="10" text-anchor="start" font-family="monospace">  the route-attestation copy [:payload :judgment :route-attestation :token-outcome-comparison] equals the root comparison: true</text><text x="40" y="410" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">The accepted-increment verdict on the same close is built from the same read:</text><text x="50" y="428" font-size="10" text-anchor="start" font-family="monospace">[:payload :judgment :accepted-increment] :accepted? true; :criterion-step {:id :apparatus/evidence-to-disposition-once, :source :recorded-decision}; :measured-tokens :restoration-accepted</text><text x="50" y="446" font-size="10" text-anchor="start" font-family="monospace">  conjunct (b) :produced-token-results[:restoration-accepted] :evidence equals the comparison row's :evidence map: true (accepted_increment.clj:71-76 re-reads the locator at the after-revision).</text><text x="50" y="464" font-size="10" text-anchor="start" font-family="monospace">  conjunct (c) :acceptance-result :evidence {:sha "HEAD" :resolved-sha 69c6346a :decl "**Status:** DONE"} — (:78-81) passes the acceptance locator as declared, so HEAD resolved at close time, not at :artifact-sha.</text><text x="40" y="496" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">The pair builder on this row (token_outcome_pair.clj:449, commit 54295ca0) — the record predates it and carries no :token-outcome-pairs key:</text><text x="50" y="514" font-size="10" text-anchor="start" font-family="monospace">:token-outcome-pairs on record? false   pairs built here: 1   pair-ok? true</text><text x="50" y="532" font-size="10" text-anchor="start" font-family="monospace">:observation {:observed true :check :C4 :observation-source :close-measurement-row}</text><text x="50" y="550" font-size="10" text-anchor="start" font-weight="bold" font-family="monospace">:truth {:status :missing, :reason :no-independent-truth-channel}   :estimable? false   :ineligibility-reasons [:truth-not-a-boolean]</text><text x="50" y="568" font-size="10" text-anchor="start" font-family="monospace">:revision-pair {:after "97e17e10", :before {:status :missing, :reason :before-revision-not-recorded}}   :pair-sha256 sha256:c2527a2a554603a9…</text><text x="40" y="600" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">Two bad cases constructed from this record and run through build-pair (:384):</text><text x="50" y="618" font-size="10" text-anchor="start" font-family="monospace">  the :accepted-increment map offered as :truth  -&gt;  :truth {:status :refused, :kind :verdict-not-a-truth, :reason :accepted-increment-verdict-refused}, :estimable? false</text><text x="50" y="636" font-size="10" text-anchor="start" font-family="monospace">  a boolean truth carrying the row's own C4 evidence map  -&gt;  pair :status :refused :kind :same-verdict-source, :estimable? false</text><text x="40" y="670" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">What the record does not contain: any value answering whether the ticket's restoration was really accepted by a channel other than reading the Status line at 97e17e10.</text><text x="40" y="688" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">The verdict :predicted-and-observed says the scorer's 175/256 and the C4 read agreed; it says nothing about whether the C4 read was right (OBS-D §1.1, §4.3).</text><text x="40" y="720" font-size="9" text-anchor="start" font-family="system-ui,sans-serif">Evidence only: the pairs and bad cases are computed here on the recorded rows; the record is unchanged.</text></svg>