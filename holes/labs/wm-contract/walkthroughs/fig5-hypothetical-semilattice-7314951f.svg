<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="980" height="380" fill="white"/><text x="30" y="36" font-size="15" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">HYPOTHETICAL — a semilattice cascade on the same target (not on any record)</text><text x="30" y="58" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">Drawn from the same tokens as the 09-23 C2 cascade to show the shape the code never recorded: two independent limbs</text><text x="30" y="74" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">converging on one acceptance. Supports {A,C}, {B,C}, {C} overlap without containment and are intersection-closed:</text><text x="30" y="90" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">classify-family's :semilattice.</text><rect x="40" y="110" width="300" height="64" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="48" y="128" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">:aif/declare-the-conditioning</text><text x="48" y="142" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">limb A (as recorded)</text><rect x="420" y="90" width="300" height="64" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="428" y="108" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">:aif/measurement-window-hygiene</text><text x="428" y="122" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">limb A cont. (as recorded)</text><rect x="40" y="240" width="300" height="64" rx="5" fill="#fdf6ec" stroke="#68717b" stroke-dasharray="6 4"/><text x="48" y="258" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">HYPOTHETICAL: a pattern citing the</text><text x="48" y="272" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">ticket precedent</text><text x="48" y="286" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">produces: calibration-evidence</text><rect x="420" y="260" width="300" height="64" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="428" y="278" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">:contracts/holder-states-the-claim</text><text x="428" y="292" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">guard needs BOTH limbs' tokens</text><text x="428" y="306" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">produces: restoration-accepted</text><path d="M340,142 L420,122" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="380" y="128" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">split-declared-valid</text><path d="M340,272 L420,292" fill="none" stroke="#68717b" stroke-dasharray="6 4" marker-end="url(#harrow)"/><text x="380" y="278" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">calibration-evidence</text><text x="420" y="246" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">convergence: the acceptance guard consumes the union of two independent limbs</text><text x="30" y="356" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">What would REQUIRE this shape: one acceptance token whose guard consumes tokens no single chain produces.</text></svg>