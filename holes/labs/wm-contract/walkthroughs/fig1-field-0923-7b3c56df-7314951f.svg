<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="352" viewBox="0 0 1080 352"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="1080" height="352" fill="white"/><text x="40" y="36" font-size="15" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">The field as scored — habit, G, and the F that was never there</text><text x="40" y="58" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">score = log(habit) + 0.0 - G/beta — the law that RAN. The docstring's habit * exp(-F - G/beta) (cascade_selection.clj:63-65) needs an F no record supplies.</text><text x="40" y="76" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">The 0.0 is cascade_selection.clj:112: "Missing prefix contributes no term, not a measured F=0." beta = 1 on both records.</text><rect x="40" y="100" width="1000" height="46" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="50" y="118" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:C1  [1790199409 (two candidates)]</text><text x="50" y="136" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">habit 0.5  G 0.7324151971422708  F nil (not-supplied)  -&gt;  log(habit) = -0.6931  + 0.0  - G/beta = -0.7324  = -1.4256</text><rect x="40" y="154" width="1000" height="46" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="50" y="172" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:C2  [1790199409 (two candidates)]</text><text x="50" y="190" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">habit 0.5  G 1.9138870492238644  F nil (not-supplied)  -&gt;  log(habit) = -0.6931  + 0.0  - G/beta = -1.9139  = -2.6070</text><rect x="40" y="208" width="1000" height="46" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="50" y="226" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:C2  [1790131591 (one candidate)]</text><text x="50" y="244" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">habit 1.0  G 0.5978370007556204  F nil (not-supplied)  -&gt;  log(habit) = 0.0000  + 0.0  - G/beta = -0.5978  = -0.5978</text><text x="40" y="284" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">On the one-candidate record the posterior is {1.0}: SPEC-N section 1 says it cannot establish multi-candidate numerical stability.</text></svg>