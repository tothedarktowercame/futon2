<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="1240" height="620" fill="white"/><text x="40" y="36" font-size="15" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">Where 175/256 comes from — the frozen rollout of 76/002</text><text x="40" y="58" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">002-selection.edn [:payload :judgment :token-outcome-prediction]: :status :frozen, :prediction-rule :positive-marginal-support, :horizon 4, model :kind :class-emission, :model-id 9277fc82…</text><text x="40" y="76" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">:initial-belief is a point mass (mass 1) on ONE set of 5 facts: :admission/task-stated, :repair/calibration-evidence-present, :repair/held-out-observations-collected, :repair/obstruction-observed-cleared, :repair/split-declared-valid</text><text x="40" y="94" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">The state space is subsets of the token universe (belief = {set-of-tokens -&gt; exact rational}); the recorded rollout's support is 2 of the 2^6 subsets.</text><text x="40" y="195" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">mass WITHOUT :restoration-accepted</text><text x="40" y="305" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">mass WITH :restoration-accepted</text><text x="340" y="150" font-size="11" text-anchor="middle" font-weight="bold" font-family="system-ui,sans-serif">tau 0 (q0)</text><rect x="295" y="172" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="340" y="192" font-size="12" text-anchor="middle" font-family="monospace">1</text><rect x="295" y="282" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="340" y="302" font-size="12" text-anchor="middle" font-family="monospace">0</text><text x="520" y="150" font-size="11" text-anchor="middle" font-weight="bold" font-family="system-ui,sans-serif">tau 1</text><rect x="475" y="172" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="520" y="192" font-size="12" text-anchor="middle" font-family="monospace">3/4</text><rect x="475" y="282" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="520" y="302" font-size="12" text-anchor="middle" font-family="monospace">1/4</text><path d="M385,190 L475,190" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="430.0" y="186.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">stay 3/4</text><path d="M380,202 L475,288" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="427.5" y="241.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">1/4</text><path d="M385,300 L475,300" fill="none" stroke="#68717b" stroke-dasharray="4 3" marker-end="url(#harrow)"/><text x="430.0" y="296.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">identity 1</text><text x="700" y="150" font-size="11" text-anchor="middle" font-weight="bold" font-family="system-ui,sans-serif">tau 2</text><rect x="655" y="172" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="700" y="192" font-size="12" text-anchor="middle" font-family="monospace">9/16</text><rect x="655" y="282" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="700" y="302" font-size="12" text-anchor="middle" font-family="monospace">7/16</text><path d="M565,190 L655,190" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="610.0" y="186.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">stay 3/4</text><path d="M560,202 L655,288" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="607.5" y="241.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">1/4</text><path d="M565,300 L655,300" fill="none" stroke="#68717b" stroke-dasharray="4 3" marker-end="url(#harrow)"/><text x="610.0" y="296.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">identity 1</text><text x="880" y="150" font-size="11" text-anchor="middle" font-weight="bold" font-family="system-ui,sans-serif">tau 3</text><rect x="835" y="172" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="880" y="192" font-size="12" text-anchor="middle" font-family="monospace">27/64</text><rect x="835" y="282" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="880" y="302" font-size="12" text-anchor="middle" font-family="monospace">37/64</text><path d="M745,190 L835,190" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="790.0" y="186.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">stay 3/4</text><path d="M740,202 L835,288" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="787.5" y="241.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">1/4</text><path d="M745,300 L835,300" fill="none" stroke="#68717b" stroke-dasharray="4 3" marker-end="url(#harrow)"/><text x="790.0" y="296.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">identity 1</text><text x="1060" y="150" font-size="11" text-anchor="middle" font-weight="bold" font-family="system-ui,sans-serif">tau 4</text><rect x="1015" y="172" width="90" height="30" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="1060" y="192" font-size="12" text-anchor="middle" font-family="monospace">81/256</text><rect x="1015" y="282" width="90" height="30" rx="5" fill="#dceee3" stroke="#287447"/><text x="1060" y="302" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">175/256</text><path d="M925,190 L1015,190" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="970.0" y="186.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">stay 3/4</text><path d="M920,202 L1015,288" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><text x="967.5" y="241.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">1/4</text><path d="M925,300 L1015,300" fill="none" stroke="#68717b" stroke-dasharray="4 3" marker-end="url(#harrow)"/><text x="970.0" y="296.0" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">identity 1</text><text x="40" y="352" font-size="10" text-anchor="start" font-family="monospace">guard search on the WITHOUT state, identical at every tau: done-is-observed-running false; evidence-to-disposition-once true</text><text x="40" y="390" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">Each step: on the state still lacking :restoration-accepted, the guard search (first-enabled, cascade_model_manifest.clj:122-126) finds evidence-to-disposition-once enabled</text><text x="40" y="404" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">   — its guard needs :repair/obstruction-observed-cleared present and the token absent — and applies it with theta 1/4: mass theta moves to the set with the token, 1 - theta stays.</text><text x="40" y="422" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">done-is-observed-running (theta 3/4) is never enabled: its guard needs :repair/obstruction-observed-cleared ABSENT, and q0 already contains it. On the state that has the token no guard holds, so the kernel is the identity.</text><text x="40" y="440" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">theta 1/4 is recorded with :theta-source :recorded-trials and :theta-provenance {:trials-count 1, :successes 0}; theta 3/4 with {:trials-count 1, :successes 1}.</text><text x="40" y="460" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">:wanted :restoration-accepted :predicted 175/256 = sum of the tau-4 mass over states containing the token = 1 - (3/4)^4 = 175/256.</text><text x="40" y="482" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">The rule named on the record, :positive-marginal-support (token_outcome.clj:42-45), is exactly this marginal; the record's :rollout :belief holds the two terminal sets at 175/256 and 81/256.</text><text x="40" y="512" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">Replay in this process — rollout-evaluation on the recorded precedence, q0 and horizon (cascade_model_manifest.clj:400): belief equal to the record: true; evaluations equal: true.</text><text x="40" y="530" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">freeze-prediction (token_outcome.clj:9) on the record's own [:payload :judgment :controller-decision] returns a map equal to the recorded prediction: true.</text><text x="40" y="560" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">The model's :rates entry on this record: {:status :absent, :reason :class-emission-has-no-token-rates} — the prediction was made with no token observation rates at all (section 5).</text><text x="40" y="590" font-size="9" text-anchor="start" font-family="system-ui,sans-serif">Every number above is read from the record; the replay lines are the only computation.</text></svg>