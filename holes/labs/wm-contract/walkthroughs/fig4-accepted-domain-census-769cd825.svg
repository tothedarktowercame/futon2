<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="638" viewBox="0 0 1240 638"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="1240" height="638" fill="white"/><text x="40" y="36" font-size="15" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">The value domain of [:payload :judgment :accepted-increment :accepted?] — every close of machinery-70..76</text><text x="40" y="58" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">accepted-increment's docstring (:34-60) promises {:accepted? true …}, {:accepted? false :failed … }, or {:accepted? :no-acceptance-declared …}; evaluate-close adds {:accepted? :refused …} on any exception.</text><text x="40" y="76" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">The fourteen closes read as follows (the census digest in this file's name is the sha256 of the fourteen close shas, in the order below).</text><text x="40" y="100" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">(a) the table</text><text x="50" y="118" font-size="9.5" text-anchor="start" font-family="monospace">close   sha8      recorded-at          outcome              :accepted?               :failed :reason                                          :criterion-step                                (c) :sha → :resolved-sha</text><text x="50" y="134" font-size="9.5" text-anchor="start" font-family="monospace">70/001  fb994fa2  2026-09-22T00:51:19  :guardrail-refusal   no key                                                                            no key                                         </text><text x="50" y="150" font-size="9.5" text-anchor="start" font-family="monospace">70/002  8fc0e7af  2026-09-22T05:23:32  :guardrail-refusal   no key                                                                            no key                                         </text><text x="50" y="166" font-size="9.5" text-anchor="start" font-family="monospace">71/001  b7517d58  2026-09-22T07:23:07  :grounded-change     no key                                                                            no key                                         </text><text x="50" y="182" font-size="9.5" text-anchor="start" font-family="monospace">71/002  ea8159c8  2026-09-22T21:12:48  :grounded-change     :refused                         :predicate-evaluation-failed                     no key                                         </text><text x="50" y="198" font-size="9.5" text-anchor="start" font-family="monospace">72/001  5e1e5272  2026-09-23T02:55:44  :grounded-change     :no-acceptance-declared          :target-has-no-mechanical-acceptance-declaration no key                                         </text><text x="50" y="214" font-size="9.5" text-anchor="start" font-family="monospace">72/002  0fd42a8d  2026-09-23T04:11:40  :grounded-change     false                    :c      :acceptance-not-observed                         no key                                         "HEAD" → 0798f96a</text><text x="50" y="230" font-size="9.5" text-anchor="start" font-family="monospace">73/001  3a299880  2026-09-23T11:20:31  :grounded-change     false                    :c      :acceptance-not-observed                         no key                                         "HEAD" → 9c8032f6</text><text x="50" y="246" font-size="9.5" text-anchor="start" font-family="monospace">73/002  d2083146  2026-09-23T17:44:59  :grounded-no-change  false                    :b      :declared-product-not-observed-true              :aif/measurement-window-hygiene recorded-decision </text><text x="50" y="262" font-size="9.5" text-anchor="start" font-family="monospace">74/001  73485f7c  2026-09-23T18:21:54  :grounded-no-change  false                    :b      :declared-product-not-observed-true              :aif/measurement-window-hygiene recorded-decision </text><text x="50" y="278" font-size="9.5" text-anchor="start" font-family="monospace">74/002  5e754f13  2026-09-23T19:06:09  :grounded-no-change  false                    :c      :acceptance-not-observed                         :aif/measurement-window-hygiene recorded-decision "HEAD" → adfa3ddb</text><text x="50" y="294" font-size="9.5" text-anchor="start" font-family="monospace">75/001  26d42d52  2026-09-23T19:58:37  :grounded-no-change  false                    :c      :acceptance-not-observed                         :aif/two-layer-calibration recorded-decision   "HEAD" → 532885b1</text><text x="50" y="310" font-size="9.5" text-anchor="start" font-family="monospace">75/002  66ef54b1  2026-09-23T20:20:59  :agent-unavailable   :no-acceptance-declared          :target-has-no-mechanical-acceptance-declaration nil chain-head-fallback :no-recorded-enacted-steps </text><text x="50" y="326" font-size="9.5" text-anchor="start" font-family="monospace">76/001  7b1bbe4e  2026-09-23T21:02:44  :grounded-no-change  false                    :c      :acceptance-not-observed                         :apparatus/done-is-observed-running recorded-decision "HEAD" → 25247100</text><text x="50" y="342" font-size="9.5" text-anchor="start" font-family="monospace">76/002  ec6ad5c3  2026-09-23T21:44:04  :grounded-no-change  true                                                                              :apparatus/evidence-to-disposition-once recorded-decision "HEAD" → 69c6346a</text><text x="40" y="378" font-size="11" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">(b) the domain, and which code change each shape dates from</text><text x="50" y="402" font-size="9.5" text-anchor="start" font-family="monospace">domain over the fourteen closes: :no-acceptance-declared × 2   :refused × 1   false × 7   no key × 3   true × 1</text><text x="50" y="418" font-size="9.5" text-anchor="start" font-family="monospace">true          1   76/002 — the one close where the predicate's three conjuncts all held (figure 3).</text><text x="50" y="434" font-size="9.5" text-anchor="start" font-family="monospace">false         7   72/002 73/001 74/002 75/001 :failed :c (acceptance read false at HEAD); 73/002 74/001 :failed :b (declared product read false at the artifact sha); 76/001 :failed :c.</text><text x="50" y="450" font-size="9.5" text-anchor="start" font-family="monospace">:refused      1   71/002 — the adapter's shape error (figure 3(b)); a keyword where the docstring promises true/false/:no-acceptance-declared, added by the try/catch at evaluate-close :157-160.</text><text x="50" y="466" font-size="9.5" text-anchor="start" font-family="monospace">:no-acceptance-declared  2   72/001 (a mission target, before the acceptance-of fallback of 8527577e) and 75/002 (an :agent-unavailable close with no action, so no target, so nil acceptance)</text><text x="50" y="482" font-size="9.5" text-anchor="start" font-family="monospace">                             — a keyword in the :accepted? position by design (:84-87).</text><text x="50" y="498" font-size="9.5" text-anchor="start" font-family="monospace">no key        3   70/001 70/002 71/001 — closed before b8bc1d7c (19:30:49Z 09-22) introduced the predicate; the judgment has no :accepted-increment key at all.</text><text x="50" y="514" font-size="9.5" text-anchor="start" font-family="monospace"></text><text x="50" y="530" font-size="9.5" text-anchor="start" font-family="monospace">AR-25 names 72/001 (:no-acceptance-declared) and 71/001 (no key). The same two shapes recur on 75/002 and on 70/001, 70/002; and :refused is a third non-boolean, on 71/002.</text><text x="50" y="546" font-size="9.5" text-anchor="start" font-family="monospace">b-update (full_loop_runner.clj:4245-4246) tests (true? :accepted?): every non-true value, boolean or not, is "not accepted" there, and retained/b-update.edn's :post-close-update copies the raw value (:4289).</text><text x="50" y="562" font-size="9.5" text-anchor="start" font-family="monospace">:criterion-step and :measured-tokens (:4101-4102) appear from 73/002 on (a651e3a4, 17:14:15Z 09-23); before that the verdict names no step. (c)'s :sha is "HEAD" wherever (c) was read; its :resolved-sha differs per close.</text><text x="40" y="592" font-size="9" text-anchor="start" font-family="system-ui,sans-serif">Evidence only: each cell is the recorded value at the named key path, or the words "no key"; nothing is normalised.</text></svg>