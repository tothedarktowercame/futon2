<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="1080" height="470" fill="white"/><text x="40" y="36" font-size="15" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">What the F-ABS receipt says when run on the recorded rows — not on either record</text><text x="40" y="58" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">law-receipt and f-consumed-record (cascade_selection.clj:177 and :186, commit ad039985) are called here on [:decision :selection-certificate :candidates].</text><text x="40" y="76" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">policy.clj:265 writes the receipt at [:decision :selection-certificate :law-applied]; :274 adds :f-consumed per candidate. Neither key is on these records.</text><rect x="40" y="100" width="1000" height="150" rx="5" fill="#fdf6ec" stroke="#68717b" stroke-dasharray="6 4"/><text x="50" y="120" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">record 1790199409 — :law-applied present on record? false; :f-consumed present? false</text><text x="50" y="144" font-size="11" text-anchor="start" font-family="monospace">:law-applied =&gt; {:law :sigma-log-E-minus-gamma-G, :omitted-terms [:F], :reason :f-not-supplied, :candidates-without-f [:C1 :C2]}</text><text x="50" y="168" font-size="11" text-anchor="start" font-family="monospace">:C1 :f-consumed =&gt; {:status :absent, :reason :not-supplied}</text><text x="50" y="188" font-size="11" text-anchor="start" font-family="monospace">:C2 :f-consumed =&gt; {:status :absent, :reason :not-supplied}</text><text x="50" y="230" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">(:candidates-without-f holds the full candidate id maps; shown here by :id only.)</text><rect x="