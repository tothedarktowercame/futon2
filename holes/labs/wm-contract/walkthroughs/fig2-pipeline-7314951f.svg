<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640"><defs><marker id="harrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68717b"/></marker></defs><rect width="1080" height="640" fill="white"/><text x="30" y="36" font-size="15" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">Where cascades come from: the assembly pipeline as it runs, with the 09-23 record's numbers</text><text x="30" y="58" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">In the 09-23 record the field is ONE admitted candidate (:C2, four limbs), construction-receipt :kind :hand-admitted :by "zai-1" :date "2026-09-22".</text><text x="30" y="74" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">Reading: "C2, the restore route: declare the split, collect prospective observations, calibrate, then accept on the evid…"</text><rect x="40" y="100" width="560" height="52" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="48" y="118" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">declared source files</text><text x="48" y="132" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">resources/wm/cascade-sources/*.edn</text><text x="620" y="130" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">live</text><path d="M320,152 L320,168" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="40" y="168" width="560" height="52" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="48" y="186" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">cascade_sources.clj</text><text x="48" y="200" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">sources: files -&gt; declared sources, warrant-pinned</text><text x="620" y="198" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">live</text><path d="M320,220 L320,236" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="40" y="236" width="560" height="52" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="48" y="254" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">cascade_problems.clj</text><text x="48" y="268" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">assemble: sources -&gt; cascade problems</text><text x="620" y="266" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">live</text><path d="M320,288 L320,304" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="40" y="304" width="560" height="52" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="48" y="322" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">cascade_proposals.clj + interpretation_construction.clj</text><text x="48" y="336" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">proposals -&gt; interpretations</text><text x="620" y="334" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">live</text><path d="M320,356 L320,372" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="40" y="372" width="560" height="52" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="48" y="390" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">construction.clj / war_machine.clj</text><text x="48" y="404" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">admit candidates with full family evidence</text><text x="620" y="402" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">live</text><path d="M320,424 L320,440" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="40" y="440" width="560" height="52" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="48" y="458" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">policy.clj + cascade_selection.clj</text><text x="48" y="472" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">score the assembled field: sigma(log E - F - G/beta)</text><text x="620" y="470" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">live</text><path d="M320,492 L320,508" fill="none" stroke="#68717b" marker-end="url(#harrow)"/><rect x="40" y="508" width="560" height="52" rx="5" fill="#f6f7f8" stroke="#68717b"/><text x="48" y="526" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">full_loop_runner.clj construct-selected-action</text><text x="48" y="540" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">thread the selected action onto the click</text><text x="620" y="538" font-size="10" text-anchor="start" font-family="system-ui,sans-serif">live</text><text x="700" y="110" font-size="12" text-anchor="start" font-weight="bold" font-family="system-ui,sans-serif">Off the serving path</text><rect x="700" y="130" width="340" height="52" rx="5" fill="#fdf6ec" stroke="#68717b" stroke-dasharray="4 3"/><text x="708" y="148" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">cascade_policy.clj organise</text><text x="708" y="162" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">exists, NOT on the serving path (fix-9)</text><rect x="700" y="194" width="340" height="52" rx="5" fill="#fdf6ec" stroke="#68717b" stroke-dasharray="4 3"/><text x="708" y="212" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">cascade_prior.clj canonical-semilattice</text><text x="708" y="226" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">exists, NOT on the serving path</text><rect x="700" y="258" width="340" height="52" rx="5" fill="#fdf6ec" stroke="#68717b" stroke-dasharray="4 3"/><text x="708" y="276" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">cascade_structure.clj receipt</text><text x="708" y="290" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">record-only; computes shape, never selects</text><rect x="700" y="322" width="340" height="52" rx="5" fill="#fdf6ec" stroke="#68717b" stroke-dasharray="4 3"/><text x="708" y="340" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">cascade_order_check.clj</text><text x="708" y="354" font-size="12" text-anchor="start" font-family="system-ui,sans-serif">admission check, not an assembler</text><text x="40" y="606" font-size="11" text-anchor="start" font-family="system-ui,sans-serif">No namespace is named for assembly: it is spread across sources/problems/proposals/interpretation-construction/construction.</text></svg>